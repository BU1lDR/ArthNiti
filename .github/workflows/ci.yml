# The checks that need no server and no browser. The browser gates in
# tools/verify/ (drive, mobile-audit, market-ui and the rest) drive a local
# Edge over CDP and are not run here.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the Requires-Python floor of the pinned set; 3.14 is what
        # the team runs. Quoted, or YAML reads 3.10 as the number 3.1.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install the pinned runtime and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # From backend/ and through `python -m`, which puts the working directory
      # on the path, so that `import app` resolves. Nothing else does:
      # tests/conftest.py only pins the ARTHNITI_* environment, and there is
      # no pyproject.toml.
      - name: pytest
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: frontend and dictionary checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run lint
        working-directory: frontend
        run: npm run lint

      - name: npm run build
        working-directory: frontend
        # vite.config.js refuses a production build whose API URL is not https.
        # This build is never deployed, so it gets a placeholder that cannot
        # resolve (.invalid is reserved by RFC 2606).
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build

      - name: i18n key parity (tools/parity4.mjs)
        run: node tools/parity4.mjs

      - name: key use vs definition (tools/keycheck.mjs)
        run: node tools/keycheck.mjs

      - name: market fetch maths and guards (no network)
        run: node --test tools/verify/market-lib-test.mjs

      # Informational: glyph-audit prints its hits and exits 0 whenever it
      # ran, so only a crash (exit 2) fails this step. It finds frontend/src
      # from its own location (fileURLToPath), so it runs from the repo root
      # like the steps above.
      - name: decorative glyph audit (informational)
        run: node tools/verify/glyph-audit.mjs
