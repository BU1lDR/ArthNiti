<!--
  अर्थNiti — the brand mark, for use on a LIGHT background.

  An eight-petal lotus rosette around a rupee coin, with three coins falling
  below it. Exported 9 Sept 2026 from frontend/src/components/BrandMark.jsx,
  which is the master: same viewBox, same paths, same paint order.

  The difference is that the component paints from the mark colour tokens (the
  CSS custom properties named "mark-petal-outer", "mark-edge" and so on in
  frontend/src/index.css), so one element serves light mode, dark mode and the
  print palette. A standalone file cannot see those, so every colour here is the
  resolved light-mode value. If you change one of those tokens, this file and
  arthniti-mark-dark.svg do not follow. Re-export them by hand.

  Note there are no double hyphens anywhere in these comments, and there must not
  be: an XML comment may not contain them, and an SVG is XML. A file with one
  fails to decode as an image, silently, everywhere.

  For a dark background use arthniti-mark-dark.svg. Only the petal hairline
  differs, and it has to, because a deep-plum edge vanishes against navy.

  The rupee sign is a <text> element, not an outline, exactly as the component
  draws it. On a machine with no font carrying U+20B9 the coin renders blank
  rather than wrong. If that happens in a slide deck, use the PNG beside this file.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="13 0 94 122"
  width="188"
  height="244"
  role="img"
  aria-labelledby="mark-title mark-desc"
>
  <title id="mark-title">अर्थNiti</title>
  <desc id="mark-desc">A lotus of eight petals around a rupee coin, with three coins falling below it.</desc>

  <defs>
    <!-- Centred on the coin, so "outward" is magenta and "inward" is gold for all
         eight petals at once: userSpaceOnUse means a petal's rotation moves the
         petal, not the ramp. The last stop lands at 0.86, not 1, so the ramp
         finishes before the petal tips do. At 1 the magenta only ever shows as a
         thin rim and the whole mark reads as orange. -->
    <radialGradient id="petal" cx="60" cy="46" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0.16" stop-color="#FBC02D"/>
      <stop offset="0.44" stop-color="#F4791F"/>
      <stop offset="0.86" stop-color="#DB1B72"/>
    </radialGradient>
  </defs>

  <!-- The hairline is structural, not decoration: the petals overlap, so where two
       meet the outline is the only thing separating one from the next. Set once on
       the group, since stroke and stroke-width inherit in SVG. -->
  <g fill="url(#petal)" stroke="rgba(136, 14, 79, 0.45)" stroke-width="2.4" stroke-linejoin="round">
    <!-- Diagonals first: shorter, wider leaves, so the four of them read as the
         layer behind the cardinals. -->
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(45 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(135 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(225 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(315 60 46)"/>
    <!-- Cardinals on top: a lens, sharp at both ends. -->
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(90 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(180 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(270 60 46)"/>
  </g>

  <!-- The coin: ring, face, highlight, glyph. -->
  <circle cx="60" cy="46" r="17.5" fill="#E8730F"/>
  <circle cx="60" cy="46" r="13" fill="#FBCB48"/>
  <ellipse cx="55" cy="40.8" rx="4.4" ry="2.3" transform="rotate(-32 55 40.8)" fill="#FDEFC0" opacity="0.72"/>
  <text
    x="60"
    y="46.5"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#7A1220"
    font-family="'Noto Sans', Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="800"
  >&#x20B9;</text>

  <!-- Falling coins. Uneven sizes and heights are what make three circles read as
       motion rather than as a row of dots. The rim is a slightly larger filled
       circle rather than a stroke, so it cannot inherit the petal edge width and
       cannot overflow the viewBox. -->
  <circle cx="33" cy="99" r="9.2" fill="#C2410C"/>
  <circle cx="33" cy="99" r="7.2" fill="#F5A31B"/>
  <circle cx="60" cy="110" r="10.2" fill="#C2410C"/>
  <circle cx="60" cy="110" r="8.2" fill="#F5A31B"/>
  <circle cx="87" cy="100" r="8.6" fill="#C2410C"/>
  <circle cx="87" cy="100" r="6.6" fill="#F5A31B"/>
</svg>
