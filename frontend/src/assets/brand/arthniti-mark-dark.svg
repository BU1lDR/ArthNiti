<!--
  अर्थNiti — the brand mark, for use on a DARK background.

  Identical to arthniti-mark.svg in every respect but one: the petal hairline is
  a pale pink instead of a deep plum. That single difference is the whole reason
  a second file exists, and it mirrors what the app does. The dark theme in
  frontend/src/index.css overrides exactly one of the eleven mark colour tokens,
  the one named "mark-edge", and leaves the other ten alone.

  The hairline is not decoration. The eight petals overlap, so where two meet the
  outline is the only thing separating one petal from the next. Against a navy
  masthead a deep-plum edge disappears and the rosette collapses into a single
  orange blob.

  No double hyphens in these comments, deliberately: an XML comment may not
  contain them, and an SVG is XML. See arthniti-mark.svg for the full notes.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="13 0 94 122"
  width="188"
  height="244"
  role="img"
  aria-labelledby="mark-title mark-desc"
>
  <title id="mark-title">अर्थNiti</title>
  <desc id="mark-desc">A lotus of eight petals around a rupee coin, with three coins falling below it.</desc>

  <defs>
    <radialGradient id="petal" cx="60" cy="46" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0.16" stop-color="#FBC02D"/>
      <stop offset="0.44" stop-color="#F4791F"/>
      <stop offset="0.86" stop-color="#DB1B72"/>
    </radialGradient>
  </defs>

  <!-- The one line that differs from the light file. -->
  <g fill="url(#petal)" stroke="rgba(255, 226, 240, 0.4)" stroke-width="2.4" stroke-linejoin="round">
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(45 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(135 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(225 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(315 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(90 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(180 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(270 60 46)"/>
  </g>

  <circle cx="60" cy="46" r="17.5" fill="#E8730F"/>
  <circle cx="60" cy="46" r="13" fill="#FBCB48"/>
  <ellipse cx="55" cy="40.8" rx="4.4" ry="2.3" transform="rotate(-32 55 40.8)" fill="#FDEFC0" opacity="0.72"/>
  <text
    x="60"
    y="46.5"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#7A1220"
    font-family="'Noto Sans', Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="800"
  >&#x20B9;</text>

  <circle cx="33" cy="99" r="9.2" fill="#C2410C"/>
  <circle cx="33" cy="99" r="7.2" fill="#F5A31B"/>
  <circle cx="60" cy="110" r="10.2" fill="#C2410C"/>
  <circle cx="60" cy="110" r="8.2" fill="#F5A31B"/>
  <circle cx="87" cy="100" r="8.6" fill="#C2410C"/>
  <circle cx="87" cy="100" r="6.6" fill="#F5A31B"/>
</svg>
