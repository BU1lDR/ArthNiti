<!--
  The अर्थNiti mark as a favicon. This is the one copy that hardcodes its colours:
  a favicon is fetched as an image, so it cannot see the page's --mark-* tokens.
  Keep it in step with the :root values in frontend/src/index.css.

  Two differences from components/BrandMark.jsx, both because a favicon renders
  at 16-32px in a tab strip: the rupee glyph is dropped (it would be two or three
  pixels of mud inside the coin) and the petal edge is thicker, since at that size
  a 2.4-unit hairline disappears and the eight petals merge into one blob.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 0 94 122">
  <defs>
    <radialGradient id="petal" cx="60" cy="46" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0.16" stop-color="#FBC02D"/>
      <stop offset="0.44" stop-color="#F4791F"/>
      <stop offset="0.86" stop-color="#DB1B72"/>
    </radialGradient>
  </defs>
  <g fill="url(#petal)" stroke="#FFF3F9" stroke-width="4" stroke-linejoin="round">
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(45 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(135 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(225 60 46)"/>
    <path d="M60 48C38 40 40 10 60 10C80 10 82 40 60 48Z" transform="rotate(315 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(90 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(180 60 46)"/>
    <path d="M60 2C74 16 78 32 60 48C42 32 46 16 60 2Z" transform="rotate(270 60 46)"/>
  </g>
  <circle cx="60" cy="46" r="17.5" fill="#E8730F"/>
  <circle cx="60" cy="46" r="13" fill="#FBCB48"/>
  <circle cx="33" cy="99" r="9.2" fill="#C2410C"/>
  <circle cx="33" cy="99" r="7.2" fill="#F5A31B"/>
  <circle cx="60" cy="110" r="10.2" fill="#C2410C"/>
  <circle cx="60" cy="110" r="8.2" fill="#F5A31B"/>
  <circle cx="87" cy="100" r="8.6" fill="#C2410C"/>
  <circle cx="87" cy="100" r="6.6" fill="#F5A31B"/>
</svg>
